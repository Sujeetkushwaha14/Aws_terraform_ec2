name: Terraform Workflow

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code from repo
      uses: actions/checkout@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: '1.5.0'

    - name: Create terraform.auto.tfvars from GitHub Secrets
      run: |
        echo "ami           = \"${{ secrets.AMI }}\"" >> main/terraform.auto.tfvars
        echo "instance_type = \"${{ secrets.INSTANCE_TYPE }}\"" >> main/terraform.auto.tfvars
        echo "region        = \"${{ secrets.REGION }}\"" >> main/terraform.auto.tfvars
        echo "az            = \"${{ secrets.AZ }}\"" >> main/terraform.auto.tfvars
        echo "subnet_cidr   = \"${{ secrets.SUBNET_CIDR }}\"" >> main/terraform.auto.tfvars
        echo "vpc_cidr      = \"${{ secrets.VPC_CIDR }}\"" >> main/terraform.auto.tfvars

    - name: Terraform Init
      run: terraform init
      working-directory: main
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Plan
      run: terraform plan -var-file=terraform.auto.tfvars
      working-directory: main
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Apply
      run: terraform apply -auto-approve -var-file=terraform.auto.tfvars
      working-directory: main
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
