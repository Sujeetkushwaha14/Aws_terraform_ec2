name: Terraform Workflow

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code from repo
      uses: actions/checkout@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: '1.5.0'

    - name: Create terraform.auto.tfvars from GitHub Secrets
      run: |
        cat <<EOF > terraform.auto.tfvars
ami           = "${{ secrets.AMI }}"
instance_type = "${{ secrets.INSTANCE_TYPE }}"
region        = "${{ secrets.REGION }}"
az            = "${{ secrets.AZ }}"
subnet_cidr   = "${{ secrets.SUBNET_CIDR }}"
vpc_cidr      = "${{ secrets.VPC_CIDR }}"
EOF

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -var-file=terraform.auto.tfvars

    - name: Terraform Apply
      run: terraform apply -auto-approve -var-file=terraform.auto.tfvars
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 
